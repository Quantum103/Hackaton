name: Validate Stoplist

on:
  push:
    branches:
      - main
      - fix/fullstack-api-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum
      - name: Test and vet backend
        working-directory: auth-service
        run: |
          go test ./...
          go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check frontend/api.js
          node --check frontend/shared.js
          node --check frontend/app.js
          node --check frontend/requests.js

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose config
        run: docker compose config -q
      - name: Start the full stack and smoke-test the API
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --build -d
          cleanup() {
            docker compose down -v --remove-orphans
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost/api/health

          SESSION_JSON=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Administrator","email":"ci-admin@example.test","password":"test-pass-123"}' \
            http://localhost/api/auth/register)
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$SESSION_JSON")
          test -n "$TOKEN"

          PRODUCTS=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" http://localhost/api/products)
          test "$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' <<< "$PRODUCTS")" = "0"

          curl --fail --silent -o /tmp/supply.json \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"number":"CI-SUPPLY-001","items":[{"name":"CI rice","unit":"g","quantity":1000,"shelfLifeHours":48}]}' \
            http://localhost/api/supplies

          PRODUCTS=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" http://localhost/api/products)
          PRODUCT_ID=$(python3 -c 'import json,sys; print(next(p["id"] for p in json.load(sys.stdin) if p["name"] == "CI rice"))' <<< "$PRODUCTS")

          # A simple text list should be parsed deterministically without waiting for Ollama.
          printf 'CI rice 100 g\nUnknown product 50 g\n' > /tmp/request.txt
          PARSED_REQUEST=$(curl --fail --silent -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F 'file=@/tmp/request.txt;type=text/plain' \
            http://localhost/api/requests/parse)
          python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["parserMode"] == "structured", d; assert len(d["items"]) == 2, d; assert d["items"][0]["productId"] != "", d; assert d["items"][0]["quantity"] == 100, d; assert d["items"][1]["productId"] == "", d; assert any("Unknown product" in w for w in d["warnings"]), d' <<< "$PARSED_REQUEST"

          # Exercise the request module end-to-end against the real SQLite database.
          curl --fail --silent -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d '{"priceKopecks":250}' "http://localhost/api/products/$PRODUCT_ID/price" > /tmp/product-price.json
          REQUEST_PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"customerName":"CI request","sourceFilename":"ci.txt","sourceHash":"a"*64,"globalDiscountPercent":10,"items":[{"productId":sys.argv[1],"quantity":2,"itemDiscountPercent":5}]}))' "$PRODUCT_ID")
          REQUEST_JSON=$(curl --fail --silent -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$REQUEST_PAYLOAD" http://localhost/api/requests)
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["totalKopecks"])' <<< "$REQUEST_JSON")" = "428"
          REQUEST_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<< "$REQUEST_JSON")
          SAVED_REQUEST=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" "http://localhost/api/requests/$REQUEST_ID")
          test "$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)["items"]))' <<< "$SAVED_REQUEST")" = "1"
          DUPLICATE_STATUS=$(curl --silent -o /tmp/duplicate-request.json -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$REQUEST_PAYLOAD" http://localhost/api/requests)
          test "$DUPLICATE_STATUS" = "409"

          # A product without a catalogue price must accept a one-off price on the request only.
          curl --fail --silent \
            -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"number":"CI-SUPPLY-002","items":[{"name":"CI manual price","unit":"pcs","quantity":10,"shelfLifeHours":48}]}' \
            http://localhost/api/supplies > /tmp/manual-supply.json
          PRODUCTS=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" http://localhost/api/products)
          MANUAL_PRODUCT_ID=$(python3 -c 'import json,sys; print(next(p["id"] for p in json.load(sys.stdin) if p["name"] == "CI manual price"))' <<< "$PRODUCTS")
          MANUAL_PAYLOAD=$(python3 -c 'import json,sys; print(json.dumps({"customerName":"manual price test","sourceFilename":"manual.txt","items":[{"productId":sys.argv[1],"quantity":1,"itemDiscountPercent":0,"unitPriceKopecks":1234}]}))' "$MANUAL_PRODUCT_ID")
          MANUAL_REQUEST=$(curl --fail --silent -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$MANUAL_PAYLOAD" http://localhost/api/requests)
          test "$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["totalKopecks"]); assert d["items"][0]["unitPriceKopecks"] == 1234' <<< "$MANUAL_REQUEST")" = "1234"

          DISH_JSON=$(curl --fail --silent \
            -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI test dish\",\"ingredients\":[{\"productId\":\"$PRODUCT_ID\",\"quantity\":100}]}" \
            http://localhost/api/dishes)
          DISH_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["dishId"])' <<< "$DISH_JSON")
          ORDER_JSON=$(python3 -c 'import json,sys; print(json.dumps({"items":[{"dishId":sys.argv[1],"portions":2}]}))' "$DISH_ID")
          curl --fail --silent \
            -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$ORDER_JSON" \
            http://localhost/api/orders
