name: Validate Stoplist

on:
  push:
    branches:
      - main
      - fix/fullstack-api-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum
      - name: Test and vet backend
        working-directory: auth-service
        run: |
          go test ./...
          go vet ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check frontend/api.js
          node --check frontend/shared.js
          node --check frontend/app.js

  docker-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Compose config
        run: docker compose config -q
      - name: Start the full stack and smoke-test the API
        shell: bash
        run: |
          set -euo pipefail
          docker compose up --build -d
          cleanup() {
            docker compose down -v --remove-orphans
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost/api/health

          SESSION_JSON=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Administrator","email":"ci-admin@example.test","password":"test-pass-123"}' \
            http://localhost/api/auth/register)
          TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$SESSION_JSON")
          test -n "$TOKEN"

          # Only the one-time bootstrap is public; all real data endpoints require JWT.
          SETUP=$(curl --fail --silent http://localhost/api/auth/setup-status)
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["setupRequired"])' <<< "$SETUP")" = "False"
          ANON_STATUS=$(curl --silent -o /tmp/anon-hot.json -w '%{http_code}' http://localhost/api/hot-offers)
          test "$ANON_STATUS" = "401"

          SELF_REGISTER_STATUS=$(curl --silent -o /tmp/self-register.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"name":"Unexpected Account","email":"not-allowed@example.test","password":"not-allowed-123"}' \
            http://localhost/api/auth/register)
          test "$SELF_REGISTER_STATUS" = "403"

          curl --fail --silent -o /tmp/viewer.json \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Viewer","email":"ci-viewer@example.test","password":"viewer-pass-123"}' \
            http://localhost/api/users
          test "$(python3 -c 'import json,sys; print(json.load(sys.stdin)["role"])' < /tmp/viewer.json)" = "viewer"

          VIEWER_SESSION=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-viewer@example.test","password":"viewer-pass-123"}' \
            http://localhost/api/auth/login)
          VIEWER_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])' <<< "$VIEWER_SESSION")
          test -n "$VIEWER_TOKEN"
          curl --fail --silent -H "Authorization: Bearer $VIEWER_TOKEN" http://localhost/api/hot-offers >/dev/null
          VIEWER_WRITE_STATUS=$(curl --silent -o /tmp/viewer-write.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $VIEWER_TOKEN" \
            -H 'Content-Type: application/json' -d '{}' http://localhost/api/supplies)
          test "$VIEWER_WRITE_STATUS" = "403"

          PRODUCTS=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" http://localhost/api/products)
          test "$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' <<< "$PRODUCTS")" = "0"

          curl --fail --silent -o /tmp/supply.json \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"number":"CI-SUPPLY-001","items":[{"name":"CI rice","unit":"g","quantity":1000,"shelfLifeHours":48}]}' \
            http://localhost/api/supplies

          PRODUCTS=$(curl --fail --silent -H "Authorization: Bearer $TOKEN" http://localhost/api/products)
          PRODUCT_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["id"])' <<< "$PRODUCTS")
          DISH_JSON=$(curl --fail --silent \
            -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"CI test dish\",\"ingredients\":[{\"productId\":\"$PRODUCT_ID\",\"quantity\":100}]}" \
            http://localhost/api/dishes)
          DISH_ID=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["dishId"])' <<< "$DISH_JSON")
          ORDER_JSON=$(python3 -c 'import json,sys; print(json.dumps({"items":[{"dishId":sys.argv[1],"portions":2}]}))' "$DISH_ID")
          curl --fail --silent \
            -X POST -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$ORDER_JSON" \
            http://localhost/api/orders

          curl --fail --silent -X POST -H "Authorization: Bearer $TOKEN" http://localhost/api/auth/logout
          REVOKED_STATUS=$(curl --silent -o /tmp/revoked.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://localhost/api/products)
          test "$REVOKED_STATUS" = "401"

