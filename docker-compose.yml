services:
  backend:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: hackaton-backend
    environment:
      SQLITE_DB_PATH: /root/data/app.db
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - db_data:/root/data
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackaton-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
