services:
  backend:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: hackaton-backend
    environment:
      SQLITE_DB_PATH: /root/data/app.db
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-secret}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:2b
    volumes:
      - db_data:/root/data
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: hackaton-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackaton-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  db_data:
  ollama_data:

networks:
  app-network:
    driver: bridge
