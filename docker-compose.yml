services:
  backend:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: hackaton-backend
    environment:
      SQLITE_DB_PATH: /root/data/app.db
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:-}
    volumes:
      - db_data:/root/data
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackaton-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
