server {
    listen 80;
    server_name localhost;

    # 1. Раздача статических файлов (HTML, CSS, JS)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Поддержка роутинга (например, #/stock) и прямых ссылок на .html файлы
        try_files $uri $uri/ $uri.html /index.html;
    }

    # 2. Проксирование всех запросов к /api/ на Go-бэкенд
    location /api/ {
        # Имя "backend" должно точно совпадать с именем сервиса в docker-compose.yml
        proxy_pass http://backend:8080/api/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}